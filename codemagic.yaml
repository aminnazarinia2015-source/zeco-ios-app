{"workflows": {"zeco-ios-testflight": {"name": "Zeco iOS - TestFlight", "max_build_duration": 60, "instance_type": "mac_mini_m2", "integrations": {"app_store_connect": "zeco_asc_key"}, "environment": {"ios_signing": {"distribution_type": "app_store", "bundle_identifier": "com.zecoinc.app"}, "vars": {"XCODE_PROJECT": "zeco-ios-app/ios/App/App.xcodeproj", "XCODE_SCHEME": "App", "BUNDLE_ID": "com.zecoinc.app"}, "xcode": "latest", "node": "latest"}, "scripts": [{"name": "Install npm dependencies", "script": "cd zeco-ios-app && npm install"}, {"name": "Set up code signing", "script": "keychain initialize && app-store-connect fetch-signing-files \"$BUNDLE_ID\" --type IOS_APP_STORE --create && keychain add-certificates && xcode-project use-profiles"}, {"name": "Bump build number", "script": "cd zeco-ios-app/ios/App && agvtool new-version -all $BUILD_NUMBER"}, {"name": "Build ipa", "script": "xcode-project build-ipa --project \"$XCODE_PROJECT\" --scheme \"$XCODE_SCHEME\""}], "artifacts": ["build/ios/ipa/*.ipa", "/tmp/xcodebuild_logs/*.log"], "publishing": {"app_store_connect": {"auth": "integration", "submit_to_testflight": true}}}}}
