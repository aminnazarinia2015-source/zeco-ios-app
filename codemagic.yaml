{"workflows": {"zeco-ios-testflight": {"name": "Zeco iOS - TestFlight", "max_build_duration": 60, "instance_type": "mac_mini_m2", "integrations": {"app_store_connect": "zeco_asc_key"}, "environment": {"groups": ["ios_signing_vars"], "vars": {"XCODE_PROJECT": "zeco-ios-app/ios/App/App.xcodeproj", "XCODE_SCHEME": "App", "BUNDLE_ID": "com.zecoinc.app"}, "xcode": "latest", "node": "latest"}, "scripts": [{"name": "Install npm dependencies", "script": "cd zeco-ios-app && npm install && npm install --no-save typescript && npx cap sync ios"}, {"name": "Set up code signing", "script": "echo \"$CERTIFICATE_PRIVATE_KEY_B64\" | base64 --decode > $HOME/cert_key.pem && keychain initialize && app-store-connect fetch-signing-files \"$BUNDLE_ID\" --type IOS_APP_STORE --create --certificate-key \"@file:$HOME/cert_key.pem\" && keychain add-certificates && xcode-project use-profiles"}, {"name": "Bump build number", "script": "cd zeco-ios-app/ios/App && agvtool new-version -all $BUILD_NUMBER"}, {"name": "Build ipa", "script": "xcode-project build-ipa --project \"$XCODE_PROJECT\" --scheme \"$XCODE_SCHEME\""}], "artifacts": ["build/ios/ipa/*.ipa", "/tmp/xcodebuild_logs/*.log"], "publishing": {"app_store_connect": {"auth": "integration", "submit_to_testflight": true}}}}}
